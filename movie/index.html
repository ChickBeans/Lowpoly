<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Movie — Neasden Temple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#dde8ec;--panel:#f6f4ee;--ink:#22262e;--dim:#5a6170;--accent:#1f8a96;--edge:#22262e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a26;--panel:#232c3c;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc8d4;--edge:#000}}
:root[data-theme="dark"]{--bg:#141a26;--panel:#232c3c;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc8d4;--edge:#000}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;font-weight:400;margin:4px 0 12px}
.tv{background:var(--edge);padding:10px;border-radius:14px;box-shadow:0 0 0 3px var(--panel) inset}
#out{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:6px;background:#000}
#gl{display:none}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
button{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;min-width:5.2em;text-align:right;color:var(--dim)}
.beats{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.beats button{font-size:.85rem;padding:4px 10px;border-radius:999px}
.note{color:var(--dim);font-size:.85rem;line-height:1.6}
label.file{display:inline-block;margin-top:6px}
.back{margin:0 0 6px;font-size:.9rem}.back a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <p class="back"><a href="../index.html">← ローポリ</a></p>
  <h1>Memory Movie：ロンドンの寺院</h1>
  <div class="tv"><canvas id="out" width="640" height="480" aria-label="寺院の前で合掌するまでの60秒のポリゴンムービー"></canvas></div>
  <canvas id="gl" width="640" height="480"></canvas>
  <div class="bar">
    <button id="play" aria-label="再生">▶</button>
    <input id="seek" type="range" min="0" max="60" step="0.05" value="0" aria-label="再生位置">
    <span class="time" id="time">0:00</span>
  </div>
  <div class="beats" id="beats"></div>
  <p class="note">最後に元の写真を並べて見たいときは、ここで写真を選んでください（写真はこの端末の中だけで使い、どこにも送りません）。<br>
    <label class="file"><input type="file" id="photo" accept="image/*"></label></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="engine/util.js"></script>
<script src="engine/timeline.js"></script>
<script src="engine/character.js"></script>
<script src="engine/audio.js"></script>
<script src="scenes/temple-env.js"></script>
<script src="scenes/temple.js"></script>
<script src="engine/player.js"></script>
<script>
(function () {
  const def = MP.SCENES.temple, player = MP.createPlayer(def, document.getElementById('gl'), document.getElementById('out'));
  const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
  let t = 0, playing = false, last = 0;
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function show() { player.renderAt(t); seek.value = t; timeEl.textContent = fmt(t); }
  function setPlaying(on) { playing = on; playBtn.textContent = on ? '⏸' : '▶'; playBtn.setAttribute('aria-label', on ? '一時停止' : '再生'); if (on) { last = performance.now(); MP.audio.start(t, def); } else MP.audio.stop(); }
  playBtn.onclick = () => { if (t >= def.duration) t = 0; setPlaying(!playing); };
  seek.oninput = () => { t = +seek.value; if (playing) MP.audio.start(t, def); show(); };
  def.beats.forEach(b => { const e = document.createElement('button'); e.textContent = b.label; e.onclick = () => { t = b.t; if (playing) MP.audio.start(t, def); show(); }; document.getElementById('beats').appendChild(e); });
  document.getElementById('photo').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { player.setOriginal(img); show(); }; img.src = URL.createObjectURL(f); };
  function loop(now) { if (playing) { t += (now - last) / 1000; last = now; if (t >= def.duration) { t = def.duration; setPlaying(false); } show(); } requestAnimationFrame(loop); }
  window.MOVIE = { renderAt: s => player.renderAt(s), duration: def.duration };
  show(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
