<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reykjavík — ローポリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9e1ec;--panel:#f3f1ea;--ink:#1b2236;--dim:#56607a;--accent:#2f62b5;--edge:#1b2236;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a2a;--panel:#212a42;--ink:#e8ecf4;--dim:#9ba6c0;--accent:#6fa0ef;--edge:#000;}}
:root[data-theme="dark"]{--bg:#141a2a;--panel:#212a42;--ink:#e8ecf4;--dim:#9ba6c0;--accent:#6fa0ef;--edge:#000;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.6rem;font-weight:400;margin:4px 0 2px}
p{margin:0;color:var(--dim);font-size:.95rem;line-height:1.6}
.tv{margin:16px 0 12px;background:var(--edge);padding:10px;border-radius:14px;box-shadow:0 0 0 3px var(--panel) inset}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:6px;touch-action:none;cursor:grab}
canvas.smooth{image-rendering:auto}
.screen{position:relative}
.crt{position:absolute;inset:0;pointer-events:none;display:none;border-radius:6px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
.screen.crt-on .crt{display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:6px;transition:opacity .35s ease-out}
.flash.on{opacity:.9;transition:none}
button.shot{border-color:var(--accent);color:var(--accent);font-weight:700}
.msg{min-height:1.4em;margin-top:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.gallery button{padding:0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--edge);line-height:0}
.gallery img{width:100%;height:auto;display:block}
.loc{position:absolute;right:4%;bottom:5%;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;color:#fff;font-family:"DotGothic16",ui-monospace,monospace;text-shadow:2px 2px 0 #0b1020,-1px -1px 0 #0b1020,1px -1px 0 #0b1020,-1px 1px 0 #0b1020;line-height:1.15}
.loc .c{font-size:clamp(11px,2.6vw,18px);letter-spacing:.2em;border-bottom:2px solid rgba(255,255,255,.85);padding-bottom:2px;margin-bottom:3px}
.loc .t{font-size:clamp(18px,5vw,34px);letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pad-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 6px;padding:12px 22px;background:var(--panel);border:2px solid var(--ink);border-radius:48px}
.dpad{position:relative;width:126px;height:126px;flex:none;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad .arm{position:absolute;background:var(--ink);border-radius:6px}
.dpad .h{left:0;top:42px;width:126px;height:42px}.dpad .v{left:42px;top:0;width:42px;height:126px}
.dpad .ar{position:absolute;color:var(--panel);font-size:14px;line-height:1;pointer-events:none}
.dpad .u{left:56px;top:10px}.dpad .d{left:56px;bottom:10px}.dpad .l{left:10px;top:56px}.dpad .r{right:10px;top:56px}
.dpad .dot{position:absolute;left:55px;top:55px;width:16px;height:16px;border-radius:50%;background:var(--panel);opacity:.25;pointer-events:none;transition:transform .06s}
.dpad.on .arm{background:var(--accent)}
.pad-a{display:flex;flex-direction:column;align-items:center;gap:6px}
button.abtn{width:78px;height:78px;padding:0;border-radius:50%;background:#c63a4f;color:#fff;border:3px solid var(--ink);font-size:1.7rem;touch-action:manipulation}
button.abtn:active{transform:translateY(2px)}
.pad-a small{font-size:.8rem;color:var(--dim)}
.hint{font-size:.85rem;margin-bottom:12px}
button{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{margin:0 0 6px;font-size:.9rem}.back a{color:var(--accent)}
</style>
</head>
<body>
<main><p class="back"><a href="index.html">← ローポリ</a></p>
  <h1 data-i="title">レイキャビク、エシャ山を望む海辺</h1>
  <p data-i="lead">写真をもとにしたオリジナルのローポリキャラ。ドラッグで左右・上下に視点を動かし、2本指（またはホイール）でズームできます。矢印キーと＋／−キーでも操作できます。</p>
  <div class="tv"><div class="screen"><canvas id="scr" width="640" height="480" data-ia="scene" aria-label="レイキャビクの海辺の遊歩道で、湾の向こうのエシャ山を背に、コーヒーを持って並んで立つローポリの2人"></canvas><div class="loc" lang="is"><span class="c">Ísland</span><span class="t">Reykjavík</span></div><div class="crt" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div></div></div>
  <div class="pad-row">
    <div class="dpad" id="dpad" role="group" data-ia="dpad" aria-label="十字キー（押した方向に歩く）"><span class="arm h"></span><span class="arm v"></span><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><span class="dot" id="dot"></span></div>
    <div class="pad-a"><button id="jump" class="abtn" data-ia="jump" aria-label="ジャンプ">A</button><small data-i="jumpL">ジャンプ</small></div>
  </div>
  <p class="hint" data-i="hint">十字キーで歩く・Aでジャンプ（キーボードはWASDとスペース）</p>
  <div class="row" role="group" data-ia="modes" aria-label="表示モード">
    <button id="m1" aria-pressed="true" data-i="ps1">初代プレステ風</button>
    <button id="m64" aria-pressed="false" data-i="n64">64風</button>
    <button id="m2" aria-pressed="false" data-i="ps2">PS2風</button>
    <button id="spin" aria-pressed="true" data-i="spin">自動で回す</button>
    <button id="walk" aria-pressed="false" data-i="walk">🚶 歩く</button>
    <button id="night" aria-pressed="false" data-i="night">夜（オーロラ）</button>
    <button id="crt" aria-pressed="false" data-i="crt">ブラウン管</button>
    <button id="mono" aria-pressed="false" data-i="mono">白黒</button>
    <button id="sepia" aria-pressed="false" data-i="sepia">セピア</button>
    <button id="photo" data-i="photo">記念写真アングル</button>
    <button id="home" data-i="home">スタート位置に戻る</button>
    <button id="shot" class="shot" data-i="shot">📸 写真を撮る</button>
    <button id="lang" lang="en">English</button>
  </div>
  <p id="shotMsg" class="msg" aria-live="polite"></p>
  <div id="gallery" class="gallery" data-ia="gallery" aria-label="撮った写真"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// ---------- language ----------
const L={ja:{title:'レイキャビク、エシャ山を望む海辺',lead:'写真をもとにしたオリジナルのローポリキャラ。ドラッグで左右・上下に視点を動かし、2本指（またはホイール）でズームできます。矢印キーと＋／−キーでも操作できます。',
  scene:'レイキャビクの海辺の遊歩道で、湾の向こうのエシャ山を背に、コーヒーを持って並んで立つローポリの2人',modes:'表示モード',ps1:'初代プレステ風',mono:'白黒',sepia:'セピア',ps2:'PS2風',n64:'64風',spin:'自動で回す',walk:'🚶 歩く',dpad:'十字キー（押した方向に歩く）',jump:'ジャンプ',jumpL:'ジャンプ',hint:'十字キーで歩く・Aでジャンプ（キーボードはWASDとスペース）',night:'夜（オーロラ）',crt:'ブラウン管',photo:'記念写真アングル',home:'スタート位置に戻る',shot:'📸 写真を撮る',gallery:'撮った写真',
  other:'English',otherLang:'en',failed:'撮影に失敗しました。もう一度試してください。',saveAs:n=>n+' を保存',alt:'撮影した写真',
  noSave:'撮影しました（この表示では保存できないので、下の写真を長押しして保存してください）',saved:n=>'保存しました：'+n,
  declined:'保存をキャンセルしました。下の写真を押せばもう一度保存できます。',rate:'少し待ってから、下の写真を押して保存してください。',err:'この表示では保存できませんでした。下の写真を長押しして保存してください。'},
 en:{title:'Reykjavík Seafront, Facing Mt. Esja',lead:'Original low-poly characters inspired by a photo. Drag to move the view around, and pinch with two fingers (or use the scroll wheel) to zoom. Arrow keys and +/− work too.',
  scene:'Two low-poly people holding coffee side by side on the Reykjavík seafront path, with Mt. Esja across the bay behind them',modes:'Display mode',ps1:'PS1 style',mono:'Black & white',sepia:'Sepia',ps2:'PS2 style',n64:'N64 style',spin:'Auto-rotate',walk:'🚶 Walk',dpad:'D-pad (walk in that direction)',jump:'Jump',jumpL:'Jump',hint:'D-pad to walk, A to jump (WASD and Space on a keyboard)',night:'Night (aurora)',crt:'CRT TV',photo:'Photo angle',home:'Back to start',shot:'📸 Take a photo',gallery:'Your photos',
  other:'日本語',otherLang:'ja',failed:'The photo didn\'t work. Please try again.',saveAs:n=>'Save '+n,alt:'Photo you took',
  noSave:'Photo taken (it can\'t be saved from this view, so press and hold the photo below to save it).',saved:n=>'Saved: '+n,
  declined:'Save cancelled. Tap the photo below to save it again.',rate:'Please wait a moment, then tap the photo below to save it.',err:'Couldn\'t save from this view. Press and hold the photo below to save it.'}};
let lang='ja';const T=k=>L[lang][k];
function applyLang(){document.documentElement.lang=lang;document.title=lang==='ja'?'Reykjavík — ローポリ':'Reykjavík — Low-poly';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.ia)));
  const lb=document.getElementById('lang');lb.textContent=T('other');lb.lang=T('otherLang');
  document.querySelectorAll('#gallery button').forEach(b=>{b.setAttribute('aria-label',T('saveAs')(b.dataset.name));b.firstChild.alt=T('alt');});
  document.getElementById('shotMsg').textContent='';}
document.getElementById('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLang();};
const canvas=document.getElementById('scr');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:false});
renderer.setPixelRatio(1);renderer.setSize(640,480,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();
const fogDay=0xc4d5ea,fogNight=0x0e2436;scene.fog=new THREE.Fog(fogDay,45,150);
const cam=new THREE.PerspectiveCamera(50,4/3,0.1,700);
const hemi=new THREE.HemisphereLight(0xcfe0ff,0x4a3a34,0.66);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc488,1.0);scene.add(sun);scene.add(sun.target);
const SUNDIR=new THREE.Vector3(-0.8,0.5,0.62).normalize();sun.target.position.set(0,0,0.6);sun.position.copy(SUNDIR).multiplyScalar(25).add(sun.target.position);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:60});
sun.shadow.bias=-0.002;sun.shadow.normalBias=0.02;
const fill=new THREE.PointLight(0xffd6a0,0,26,1);fill.position.set(2.5,3,6);scene.add(fill);

const snap={value:0};const textures=[];
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);textures.push(t);return t;}
function mat(o,C){const m=new (C||THREE.MeshLambertMaterial)(o);
  m.onBeforeCompile=s=>{s.uniforms.uSnap=snap;s.vertexShader='uniform float uSnap;\n'+s.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\nif(uSnap>0.0){gl_Position.xy=floor(gl_Position.xy/gl_Position.w*uSnap+0.5)/uSnap*gl_Position.w;}');};return m;}
const col=c=>mat({color:c});
const Y=new THREE.Vector3(0,1,0),V=(x,y,z)=>new THREE.Vector3(x,y,z);
const pick=a=>a[Math.floor(rnd()*a.length)];
// day/night bookkeeping
const toned=[],glows=[],nightOnly=[];
function M(c,flat,extra){return mat(Object.assign({color:c,side:THREE.DoubleSide},flat?{flatShading:true,shininess:0,specular:0}:{shininess:18,specular:0x1c1c1c},extra||{}),THREE.MeshPhongMaterial);}
function TM(d,n,flat,extra){const m=M(d,flat,extra);toned.push([m,d,n]);return m;}
// value noise, so every machine gets the same mountain
function hash2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
// merge many small pieces into one mesh (vertex colours carry the per-piece colour)
function placed(geo,p,r,s,c){geo.applyMatrix4(new THREE.Matrix4().compose(V(...p),new THREE.Quaternion().setFromEuler(new THREE.Euler(...(r||[0,0,0]))),V(...(s||[1,1,1]))));geo.userData.c=c;return geo;}
function merge(list){const pos=[],nor=[],cl=[],c=new THREE.Color();
  list.forEach(g=>{c.set(g.userData.c===undefined?0xffffff:g.userData.c);const n=g.index?g.toNonIndexed():g;if(!n.attributes.normal)n.computeVertexNormals();
    const p=n.attributes.position.array,nn=n.attributes.normal.array;for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(nn[i]);}for(let i=0;i<p.length/3;i++)cl.push(c.r,c.g,c.b);});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));return g;}
const KINDS=['ps1','n64','ps2'];

// ---------- sky ----------
const SR=300,skyGeo=new THREE.SphereGeometry(SR,24,14);
const skyCol=new Float32Array(skyGeo.attributes.position.count*3);skyGeo.setAttribute('color',new THREE.BufferAttribute(skyCol,3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-2;scene.add(sky);
const SKY_DAY=[0x4f8bdc,0x9fc1ea,0xecdcca],SKY_NIGHT=[0x030818,0x0a1c38,0x14404c];
let skyBands=0,lastSky=SKY_DAY;
function paintSky(top,mid,hor){lastSky=[top,mid,hor];const p=skyGeo.attributes.position,a=new THREE.Color(top),b=new THREE.Color(mid),h=new THREE.Color(hor),c=new THREE.Color();
  for(let i=0;i<p.count;i++){let e=p.getY(i)/SR;if(skyBands&&e>0.02)e=Math.ceil(e*skyBands)/skyBands;
    if(e<0.02)c.copy(h);else if(e<0.25)c.copy(h).lerp(b,(e-0.02)/0.23);else c.copy(b).lerp(a,Math.min(1,(e-0.25)/0.6));
    skyCol[i*3]=c.r;skyCol[i*3+1]=c.g;skyCol[i*3+2]=c.b;}skyGeo.attributes.color.needsUpdate=true;}
paintSky(...SKY_DAY);
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<500;i++){const az=rnd()*Math.PI*2,el=0.06+Math.pow(rnd(),0.7)*1.4,R=280;a.push(Math.cos(el)*Math.sin(az)*R,Math.sin(el)*R,-Math.cos(el)*Math.cos(az)*R);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const m=new THREE.PointsMaterial({color:0xffffff,size:1.5,sizeAttenuation:false,fog:false,transparent:true,opacity:0.9});
  sky.add(new THREE.Points(g,m));nightOnly.push(m);}

// ---------- clouds: white and grey only, one kind per console ----------
const cloudMats=[];
function cMat(m,c){m.userData.c=c;cloudMats.push(m);return m;}
const CLOUDS=[];for(let i=0;i<13;i++){const az=-1.9+i/12*3.8+(rnd()-.5)*0.3,d=170+rnd()*80;CLOUDS.push([Math.sin(az)*d,58+rnd()*30,-Math.cos(az)*d,0.8+rnd()*0.5]);}
for(let i=0;i<5;i++){const az=Math.PI+(rnd()-.5)*2.4,d=180+rnd()*60;CLOUDS.push([Math.sin(az)*d,62+rnd()*24,-Math.cos(az)*d,0.8+rnd()*0.4]);}
const cloudsPS1=new THREE.Group();scene.add(cloudsPS1);
{const top=cMat(new THREE.MeshBasicMaterial({color:0xf6f7f9,fog:false}),0xf6f7f9),under=cMat(new THREE.MeshBasicMaterial({color:0xcfd6df,fog:false}),0xcfd6df);
  CLOUDS.forEach(([x,y,z,s])=>{const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);g.lookAt(0,y,0);
    for(let i=0;i<5;i++){const r=8+rnd()*6,px=(i-2)*10+rnd()*4,b=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),top);b.position.set(px,rnd()*3,0);b.scale.set(1.4,0.42,0.6);g.add(b);
      const u=new THREE.Mesh(new THREE.IcosahedronGeometry(r*0.9,0),under);u.position.set(px+1,-2.6,1);u.scale.set(1.4,0.3,0.6);g.add(u);}
    cloudsPS1.add(g);});}
const puffT=tex(32,32,(g)=>{const gr=g.createRadialGradient(16,16,2,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.55,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);});
function spriteClouds(n,shade){const grp=new THREE.Group();grp.visible=false;scene.add(grp);
  CLOUDS.forEach(([x,y,z,s])=>{const ax=V(-z,0,x).normalize();
    for(let i=0;i<n;i++){const o=(i-(n-1)/2)*9*s+(rnd()-.5)*5,w=(22+rnd()*18)*s,px=x+ax.x*o,pz=z+ax.z*o,py=y+rnd()*5*s;
      if(shade){const sm=cMat(new THREE.SpriteMaterial({map:puffT,color:0xa9b4c4,fog:false,transparent:true,depthWrite:false}),0xa9b4c4);
        const sh=new THREE.Sprite(sm);sh.position.set(px,py-w*0.12,pz);sh.scale.set(w*1.05,w*0.4,1);grp.add(sh);}
      const c=0xffffff-Math.floor(rnd()*3)*0x060504;
      const m=cMat(new THREE.SpriteMaterial({map:puffT,color:c,fog:false,transparent:true,depthWrite:false}),c);
      const sp=new THREE.Sprite(m);sp.position.set(px,py,pz);sp.scale.set(w,w*0.45,1);sp.renderOrder=1;grp.add(sp);}});return grp;}
const cloudsN64=spriteClouds(4,false),cloudsPS2=spriteClouds(8,true);

// ---------- the bay ----------
const seaT=tex(32,32,(g)=>{g.fillStyle='#3d5f93';g.fillRect(0,0,32,32);
  for(let i=0;i<40;i++){g.fillStyle=rnd()<.5?'#5579ab':'#2f4f80';g.fillRect(Math.floor(rnd()*32),Math.floor(rnd()*32),3+Math.floor(rnd()*4),1);}},40,22);
const seaGeo=new THREE.PlaneGeometry(320,170,64,30);
const sea=new THREE.Mesh(seaGeo,mat({map:seaT}));sea.rotation.x=-Math.PI/2;sea.position.set(0,-0.35,-86);scene.add(sea);
const seaBase=seaGeo.attributes.position.array.slice();

// ---------- Esja: flat-topped massif across the bay, terraced slopes, gullies, snow streaks ----------
const prof=[[-40,0],[-34,1.2],[-26,2.4],[-20,3.2],[-16,3.4],[-11,4.4],[-6,5.2],[-2,5.6],[1,6.4],[5,6.6],[9,6.2],[13,5.8],[18,5.9],[24,5.5],[30,5.0],[40,4.2]];
function profH(x){x=Math.max(-40,Math.min(40,x));for(let i=0;i<prof.length-1;i++){const p=prof[i],q=prof[i+1];if(x<=q[0]){const t=(x-p[0])/(q[0]-p[0]);return p[1]+(q[1]-p[1])*t;}}return prof[prof.length-1][1];}
const sm=t=>t<0?0:t>1?1:t*t*(3-2*t);
function makeMassif(nx,nz,kind){const g=new THREE.PlaneGeometry(100,18,nx,nz);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,cs=[],cA=new THREE.Color(),cB=new THREE.Color(),fine=kind==='ps2';

function blocked(px,pz,yw){for(let i=0;i<2;i++){const [x,z]=personAt(i,px,pz,yw);
  if(x<-13||x>13||z<-0.3||z>8.4)return true;
  for(const [cx,cz,r] of COLL)if(Math.hypot(x-cx,z-cz)<r+0.2)return true;}return false;}
// ---------- controller: d-pad, A to jump, WASD/Space ----------
const dpad=document.getElementById('dpad'),dot=document.getElementById('dot');let padX=0,padY=0,padId=null;const keys=new Set();
function padAt(e){const r=dpad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<10){padX=padY=0;}else{const a=Math.round(Math.atan2(-dy,dx)/(Math.PI/4))*(Math.PI/4);padX=Math.cos(a);padY=Math.sin(a);if(Math.abs(padX)<1e-6)padX=0;if(Math.abs(padY)<1e-6)padY=0;}
  dot.style.transform='translate('+(padX*30)+'px,'+(-padY*30)+'px)';dpad.classList.toggle('on',!!(padX||padY));}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;dpad.setPointerCapture(e.pointerId);padAt(e);});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padAt(e);});
const padEnd=e=>{if(e.pointerId!==padId)return;padId=null;padX=padY=0;dot.style.transform='';dpad.classList.remove('on');};
dpad.addEventListener('pointerup',padEnd);dpad.addEventListener('pointercancel',padEnd);
let jumpT=-1;const doJump=()=>{if(jumpT<0)jumpT=0;};
document.getElementById('jump').onclick=doJump;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){keys.add(k);e.preventDefault();}
  else if(k===' '&&(e.target===document.body||e.target===canvas)){doJump();e.preventDefault();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
function readInput(){let x=padX,y=padY;if(keys.size){x=(keys.has('d')?1:0)-(keys.has('a')?1:0);y=(keys.has('w')?1:0)-(keys.has('s')?1:0);}const l=Math.hypot(x,y);return l>1?[x/l,y/l]:[x,y];}
document.getElementById('home').onclick=()=>{stopWalk();wa=0;wx=START[0];wz=START[1];yaw=0;fx.set(wx,0,wz);PCX=wx;PCZ=wz+PRZ;photoAngle();};
document.getElementById('photo').onclick=photoAngle;

// ---------- modes ----------
const btns={ps1:document.getElementById('m1'),n64:document.getElementById('m64'),ps2:document.getElementById('m2')};
let mode='ps1';
function shadowRes(n){if(sun.shadow.mapSize.x===n)return;sun.shadow.mapSize.set(n,n);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
function setMode(m){mode=m;const sharp=m==='ps1';
  textures.forEach(t=>{t.magFilter=t.minFilter=sharp?THREE.NearestFilter:THREE.LinearFilter;t.needsUpdate=true;});
  KINDS.forEach(k=>{const on=k===m;pairs[k].g.visible=massifs[k].visible=cones[k].visible=grounds[k].visible=rocks[k].visible=grass[k].visible=on;});
  cloudsPS1.visible=m==='ps1';cloudsN64.visible=m==='n64';cloudsPS2.visible=m==='ps2';
  skyBands=m==='ps1'?7:0;paintSky(...lastSky);
  const F={ps1:[45,150],n64:[16,90],ps2:[70,260]}[m];scene.fog.near=F[0];scene.fog.far=F[1];
  shadowRes(m==='ps1'?1024:2048);
  canvas.classList.toggle('smooth',m!=='ps1');Object.keys(btns).forEach(k=>btns[k].setAttribute('aria-pressed',String(k===m)));}
Object.keys(btns).forEach(k=>btns[k].onclick=()=>setMode(k));setMode('ps1');

// ---------- photo capture ----------
let wantShot=false,dl=null;
const shotBtn=document.getElementById('shot'),msg=document.getElementById('shotMsg'),gallery=document.getElementById('gallery'),flashEl=document.querySelector('.flash');
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{dl=d;}).catch(()=>{dl=null;});}
shotBtn.onclick=()=>{wantShot=true;};
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
function takeShot(){
  const W2=1280,H2=960,c=document.createElement('canvas');c.width=W2;c.height=H2;const g=c.getContext('2d');
  g.imageSmoothingEnabled=canvas.classList.contains('smooth');g.drawImage(canvas,0,0,W2,H2);
  if(tone!=='none'){const im=g.getImageData(0,0,W2,H2),D=im.data;
    for(let i=0;i<D.length;i+=4){const r=D[i],gg=D[i+1],b=D[i+2];
      if(tone==='mono'){const l=0.2126*r+0.7152*gg+0.0722*b;D[i]=D[i+1]=D[i+2]=l;}
      else{D[i]=Math.min(255,0.393*r+0.769*gg+0.189*b);D[i+1]=Math.min(255,0.349*r+0.686*gg+0.168*b);D[i+2]=Math.min(255,0.272*r+0.534*gg+0.131*b);}}
    g.putImageData(im,0,0);}
  g.textAlign='right';g.textBaseline='alphabetic';g.lineJoin='round';
  const font=(px)=>px+'px "DotGothic16", monospace',x=W2*0.96;
  g.font=font(30);g.lineWidth=6;g.strokeStyle='#0b1020';g.fillStyle='#fff';
  const small='Í s l a n d',cy=H2*0.86;g.strokeText(small,x,cy);g.fillText(small,x,cy);
  const cw=g.measureText(small).width;g.fillStyle='#0b1020';g.fillRect(x-cw-2,cy+6,cw+4,6);g.fillStyle='#fff';g.fillRect(x-cw,cy+7,cw,3);
  g.font=font(58);g.lineWidth=8;g.strokeText('Reykjavík',x,H2*0.94);g.fillText('Reykjavík',x,H2*0.94);
  if(screenEl.classList.contains('crt-on')){g.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H2;y+=6)g.fillRect(0,y,W2,2);
    const vg=g.createRadialGradient(W2/2,H2/2,Math.min(W2,H2)*0.45,W2/2,H2/2,Math.max(W2,H2)*0.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=vg;g.fillRect(0,0,W2,H2);}
  flashEl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>flashEl.classList.remove('on')));
  c.toBlob(blob=>{if(!blob){msg.textContent=T('failed');return;}
    const name='reykjavik-'+stamp()+(night?'-aurora':'')+'.png',url=URL.createObjectURL(blob);
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',T('saveAs')(name));b.dataset.name=name;
    const im=document.createElement('img');im.src=url;im.alt=T('alt');b.appendChild(im);gallery.prepend(b);
    b.onclick=()=>saveShot(name,blob);
    saveShot(name,blob);},'image/png');}
async function saveShot(name,blob){
  if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg.textContent=T('saved')(name);}catch(e){msg.textContent=T('noSave');}return;}
  try{await dl.save({filename:name,data:blob});msg.textContent=T('saved')(name);}
  catch(e){const c=e&&e.code;
    if(c==='declined')msg.textContent=T('declined');
    else if(c==='rate_limited')msg.textContent=T('rate');
    else msg.textContent=T('err');}}

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(auto&&!drag){theta+=dt*0.2*dir;if(theta-autoBase>0.9)dir=-1;if(theta-autoBase<-0.9)dir=1;}
  const [ix,iy]=readInput(),manual=Math.hypot(ix,iy)>0.1;
  if(manual){if(walking)stopWalk();if(auto){auto=false;spinBtn.setAttribute('aria-pressed','false');}
    const dx=-Math.sin(theta)*iy+Math.cos(theta)*ix,dz=-Math.cos(theta)*iy-Math.sin(theta)*ix;
    let d=Math.atan2(dx,dz)-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));const ny=yaw+d*Math.min(1,dt*10);if(!blocked(wx,wz,ny))yaw=ny;
    const nx=wx+dx*1.4*dt,nz=wz+dz*1.4*dt;
    if(!blocked(nx,nz,yaw)){wx=nx;wz=nz;}else if(!blocked(nx,wz,yaw))wx=nx;else if(!blocked(wx,nz,yaw))wz=nz;}
  else if(walking){const na=wa+dt/7,nx=PCX+PRX*Math.sin(na),nz=PCZ-PRZ*Math.cos(na),ny=Math.atan2(PRX*Math.cos(na),PRZ*Math.sin(na));
    if(blocked(nx,nz,ny))stopWalk();else{wa=na;wx=nx;wz=nz;yaw=ny;}}
  const moving=manual||walking;amp=moving?Math.min(1,amp+dt*3):Math.max(0,amp-dt*3);if(amp>0)phase+=dt*(manual?7.0:6.2);
  const S=pairs[mode];
  let jy=0;if(jumpT>=0){jumpT+=dt;const k=jumpT/0.6;jy=4*0.36*k*(1-k);if(k>=1){jumpT=-1;jy=0;S.g.updateMatrixWorld(true);dust(S);}}
  fx.x+=(wx-fx.x)*Math.min(1,dt*3);fx.z+=(wz-fx.z)*Math.min(1,dt*3);
  sun.target.position.set(fx.x,0,fx.z);sun.position.copy(SUNDIR).multiplyScalar(25).add(sun.target.position);
  cam.position.set(fx.x+Math.sin(theta)*R,camY,fx.z+Math.cos(theta)*R);cam.lookAt(fx.x,1.1,fx.z-1.2);
  sky.position.copy(cam.position);
  // the bay
  const p=seaGeo.attributes.position;
  for(let i=0;i<p.count;i++){const x=seaBase[i*3],y=seaBase[i*3+1];p.setZ(i,Math.sin(x*0.5+t)*0.06+Math.cos(y*0.7+t*0.8)*0.05);}
  p.needsUpdate=true;
  spk.forEach((q,i)=>{q.material.opacity=Math.max(0,Math.sin(t*3.1+i*2.1))*(night?0.5:0.9);});
  foam.forEach(f=>{f.material.opacity=Math.max(0,Math.sin(t*0.9+f.userData.ph))*(night?0.25:0.7);});
  strollers.forEach(g=>{const u=g.userData;u.x+=u.v*dt;if(u.x>45)u.x=-45;if(u.x<-45)u.x=45;g.position.set(u.x,Math.abs(Math.sin(t*6+u.ph))*0.04,u.z);g.rotation.y=u.v>0?Math.PI/2:-Math.PI/2;});
  // the two of them
  const sw=Math.sin(phase)*amp;
  S.g.position.set(wx,0,wz);S.g.rotation.y=yaw;
  S.people.forEach((C,ci)=>{const [px,pz]=personAt(ci,wx,wz,yaw);
    C.g.position.y=groundH(px,pz)+Math.abs(Math.cos(phase+ci*0.5))*0.03*amp+jy;
    C.g.scale.y=1+Math.sin(t*1.6+ci)*0.005;
    C.head.rotation.y=Math.sin(t*0.6+ci*1.7)*0.06;C.head.rotation.x=Math.sin(t*0.9+ci)*0.025;C.head.rotation.z=C.tilt+Math.sin(t*0.5+ci)*0.015;
    C.legs.forEach((l,i)=>{l.rotation.x=(i?-1:1)*sw*0.5-(jumpT>=0?0.35*Math.sin(Math.PI*jumpT/0.6)*(i?1:0.6):0);});});
  const him=S.him,her=S.her;
  him.arms.forEach((a,i)=>{a.rotation.x=(i?1:-1)*sw*him.swing[i]+Math.sin(t*0.7+i*2)*0.02*(1-amp);});
  const wc=t%7;him.peace.rotation.z=amp<0.1&&wc<1.3?Math.sin(wc*14)*0.16*Math.sin(wc/1.3*Math.PI):0;
  her.hold.rotation.x=Math.sin(phase*2)*0.035*amp+Math.sin(t*0.8)*0.015;
  her.hair[0].rotation.x=Math.sin(t*1.3)*0.03+Math.sin(phase*2)*0.05*amp;her.hair[1].rotation.z=0.12+Math.sin(t*1.1+1)*0.05+sw*0.08;
  her.tassels.forEach((q,i)=>{q.rotation.z=Math.sin(t*2.4+i*0.7)*0.18+sw*0.2;q.rotation.x=Math.sin(t*1.7+i)*0.1;});
  her.ends.forEach((e,i)=>{e.rotation.x=Math.sin(t*1.5+i)*0.04+Math.abs(sw)*0.12;});
  her.bag.rotation.z=Math.sin(t*1.2)*0.04+sw*0.15;
  S.g.updateMatrixWorld(true);
  emitEffects(S,dt);updateParts(dt);
  if(night)updateAurora(t,dt);else updateGulls(t);
  renderer.render(scene,cam);if(wantShot){wantShot=false;takeShot();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
