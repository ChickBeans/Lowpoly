<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafís — ローポリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#dde8ec;--panel:#f6f4ee;--ink:#22262e;--dim:#5a6170;--accent:#1f8a96;--edge:#22262e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a26;--panel:#232c3c;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc8d4;--edge:#000;}}
:root[data-theme="dark"]{--bg:#141a26;--panel:#232c3c;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc8d4;--edge:#000;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.6rem;font-weight:400;margin:4px 0 2px}
p{margin:0;color:var(--dim);font-size:.95rem;line-height:1.6}
.tv{margin:16px 0 12px;background:var(--edge);padding:10px;border-radius:14px;box-shadow:0 0 0 3px var(--panel) inset}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:6px;touch-action:none;cursor:grab}
canvas.smooth{image-rendering:auto}
.screen{position:relative}
.crt{position:absolute;inset:0;pointer-events:none;display:none;border-radius:6px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
.screen.crt-on .crt{display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:6px;transition:opacity .35s ease-out}
.flash.on{opacity:.9;transition:none}
button.shot{border-color:var(--accent);color:var(--accent);font-weight:700}
.msg{min-height:1.4em;margin-top:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.gallery button{padding:0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--edge);line-height:0}
.gallery img{width:100%;height:auto;display:block}
.loc{position:absolute;right:4%;bottom:5%;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;color:#fff;font-family:"DotGothic16",ui-monospace,monospace;text-shadow:2px 2px 0 #0b1020,-1px -1px 0 #0b1020,1px -1px 0 #0b1020,-1px 1px 0 #0b1020;line-height:1.15}
.loc .c{font-size:clamp(9px,2.2vw,16px);letter-spacing:.06em;border-bottom:2px solid rgba(255,255,255,.85);padding-bottom:2px;margin-bottom:3px}
.loc .t{font-size:clamp(18px,5vw,34px);letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pad-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 6px;padding:12px 22px;background:var(--panel);border:2px solid var(--ink);border-radius:48px}
.dpad{position:relative;width:126px;height:126px;flex:none;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad .arm{position:absolute;background:var(--ink);border-radius:6px}
.dpad .h{left:0;top:42px;width:126px;height:42px}.dpad .v{left:42px;top:0;width:42px;height:126px}
.dpad .ar{position:absolute;color:var(--panel);font-size:14px;line-height:1;pointer-events:none}
.dpad .u{left:56px;top:10px}.dpad .d{left:56px;bottom:10px}.dpad .l{left:10px;top:56px}.dpad .r{right:10px;top:56px}
.dpad .dot{position:absolute;left:55px;top:55px;width:16px;height:16px;border-radius:50%;background:var(--panel);opacity:.25;pointer-events:none;transition:transform .06s}
.dpad.on .arm{background:var(--accent)}
.pad-a{display:flex;flex-direction:column;align-items:center;gap:6px}
button.abtn{width:78px;height:78px;padding:0;border-radius:50%;background:#c63a4f;color:#fff;border:3px solid var(--ink);font-size:1.7rem;touch-action:manipulation}
button.abtn:active{transform:translateY(2px)}
.pad-ab{display:flex;gap:12px;align-items:flex-end}.pad-a.up{margin-bottom:22px}button.abtn.bbtn{background:#d9a62b;color:#22262e}
.pad-a small{font-size:.8rem;color:var(--dim)}
.hint{font-size:.85rem;margin-bottom:4px;text-align:center}
button{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{margin:0 0 6px;font-size:.9rem}.back a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 6px}.top .back{margin:0}
button#lang{font-size:.85rem;padding:4px 10px}
.pad-sub{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:4px 0 4px}
button.pill{font-size:.9rem;padding:6px 14px;border-radius:999px}
button.shot.big{display:block;width:100%;margin:10px 0 4px;padding:12px;font-size:1.1rem}
.opts{display:grid;gap:10px;margin-top:10px;padding:12px 14px;background:var(--panel);border:2px solid var(--ink);border-radius:10px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{width:4.6em;flex:none;font-size:.85rem;color:var(--dim)}
.opt button{font-size:.9rem;padding:6px 10px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-left:2px solid var(--ink)}.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{border-color:var(--ink)}
</style>
</head>
<body>
<main><div class="top"><p class="back"><a href="index.html">← ローポリ</a></p><button id="lang" lang="en">English</button></div>
  <h1 data-i="title">アイスランド、薄氷の海岸</h1>
  <div class="tv"><div class="screen"><canvas id="scr" width="640" height="480" data-ia="scene" aria-label="アイスランドの海岸、黒い砂浜に張った薄氷の上に立つローポリの女性"></canvas><div class="loc" lang="is"><span class="c">Ísland</span><span class="t">Hafís</span></div><div class="crt" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div></div></div>
  <div class="pad-row">
    <div class="dpad" id="dpad" role="group" data-ia="dpad" aria-label="十字キー（押した方向に歩く）"><span class="arm h"></span><span class="arm v"></span><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><span class="dot" id="dot"></span></div>
    <div class="pad-ab"><div class="pad-a"><button id="grab" class="abtn bbtn" data-ia="grab" aria-label="氷を拾う／投げる">B</button><small data-i="grabL">拾う／投げる</small></div><div class="pad-a up"><button id="jump" class="abtn" data-ia="jump" aria-label="ジャンプ">A</button><small data-i="jumpL">ジャンプ</small></div></div>
  </div>
  <div class="pad-sub">
    <button id="walk" class="pill" aria-pressed="false" data-i="walk">🚶 歩く</button>
    <button id="home" class="pill" data-i="home">スタート位置に戻る</button>
  </div>
  <p class="hint" data-i="hint">十字キーで歩く・Aでジャンプ・Bで氷を拾う／投げる（キーボードはWASD・スペース・E）</p>
  <button id="shot" class="shot big" data-i="shot">📸 写真を撮る</button>
  <section class="opts" data-ia="opts" aria-label="表示の設定">
    <div class="opt"><span class="lbl" data-i="gMode">機種</span><div class="seg" role="group" data-ia="modes" aria-label="表示モード"><button id="m1" aria-pressed="true" data-i="ps1">初代プレステ風</button><button id="m64" aria-pressed="false" data-i="n64">64風</button><button id="m2" aria-pressed="false" data-i="ps2">PS2風</button></div></div>
    <div class="opt"><span class="lbl" data-i="gScene">シーン</span><button id="night" aria-pressed="false" data-i="night">オーロラの夜</button><button id="snd" aria-pressed="true" data-i="snd">🔊 音</button></div>
    <div class="opt"><span class="lbl" data-i="gLook">画面</span><div class="seg" role="group"><button id="color" aria-pressed="true" data-i="color">カラー</button><button id="mono" aria-pressed="false" data-i="mono">白黒</button><button id="sepia" aria-pressed="false" data-i="sepia">セピア</button></div><button id="crt" aria-pressed="false" data-i="crt">ブラウン管</button></div>
    <div class="opt"><span class="lbl" data-i="gCam">カメラ</span><button id="spin" aria-pressed="true" data-i="spin">自動で回す</button><button id="photo" data-i="photo">記念写真アングル</button></div>
  </section>
  <p id="shotMsg" class="msg" aria-live="polite"></p>
  <div id="gallery" class="gallery" data-ia="gallery" aria-label="撮った写真"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// ---------- language ----------
const L={ja:{title:'アイスランド、薄氷の海岸',lead:'写真をもとにしたオリジナルのローポリキャラ。ドラッグで左右・上下に視点を動かし、2本指（またはホイール）でズームできます。矢印キーと＋／−キーでも操作できます。',
  scene:'アイスランドの海岸、黒い砂浜に張った薄氷の上に立つローポリの女性',modes:'表示モード',ps1:'初代プレステ風',mono:'白黒',sepia:'セピア',ps2:'PS2風',n64:'64風',spin:'自動で回す',walk:'🚶 歩く',dpad:'十字キー（押した方向に歩く）',jump:'ジャンプ',jumpL:'ジャンプ',hint:'十字キーで歩く・Aでジャンプ・Bで氷を拾う／投げる（キーボードはWASD・スペース・E）',grab:'氷を拾う／投げる',grabL:'拾う／投げる',night:'オーロラの夜',snd:'🔊 音',crt:'ブラウン管',photo:'記念写真アングル',home:'スタート位置に戻る',shot:'📸 写真を撮る',gallery:'撮った写真',
  gMode:'機種',gLook:'画面',gScene:'シーン',gCam:'カメラ',color:'カラー',opts:'表示の設定',other:'English',otherLang:'en',failed:'撮影に失敗しました。もう一度試してください。',saveAs:n=>n+' を保存',alt:'撮影した写真',
  noSave:'撮影しました（この表示では保存できないので、下の写真を長押しして保存してください）',saved:n=>'保存しました：'+n,
  declined:'保存をキャンセルしました。下の写真を押せばもう一度保存できます。',rate:'少し待ってから、下の写真を押して保存してください。',err:'この表示では保存できませんでした。下の写真を長押しして保存してください。'},
 en:{title:'Thin Sea Ice on the Icelandic Shore',lead:'An original low-poly character inspired by a photo. Drag to move the view around, and pinch with two fingers (or use the scroll wheel) to zoom. Arrow keys and +/− work too.',
  scene:'A low-poly woman standing on thin sea ice over black volcanic sand on the Icelandic shore',modes:'Display mode',ps1:'PS1 style',mono:'Black & white',sepia:'Sepia',ps2:'PS2 style',n64:'N64 style',spin:'Auto-rotate',walk:'🚶 Walk',dpad:'D-pad (walk in that direction)',jump:'Jump',jumpL:'Jump',hint:'D-pad to walk, A to jump, B to pick up / throw ice (WASD, Space and E on a keyboard)',grab:'Pick up / throw ice',grabL:'Pick up / throw',night:'Aurora night',snd:'🔊 Sound',crt:'CRT TV',photo:'Photo angle',home:'Back to start',shot:'📸 Take a photo',gallery:'Your photos',
  gMode:'Console',gLook:'Screen',gScene:'Scene',gCam:'Camera',color:'Color',opts:'Display settings',other:'日本語',otherLang:'ja',failed:'The photo didn\'t work. Please try again.',saveAs:n=>'Save '+n,alt:'Photo you took',
  noSave:'Photo taken (it can\'t be saved from this view, so press and hold the photo below to save it).',saved:n=>'Saved: '+n,
  declined:'Save cancelled. Tap the photo below to save it again.',rate:'Please wait a moment, then tap the photo below to save it.',err:'Couldn\'t save from this view. Press and hold the photo below to save it.'}};
let lang='ja';const T=k=>L[lang][k];
function applyLang(){document.documentElement.lang=lang;document.title=lang==='ja'?'Hafís — ローポリ':'Hafís — Low-poly';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.ia)));
  const lb=document.getElementById('lang');lb.textContent=T('other');lb.lang=T('otherLang');
  document.querySelectorAll('#gallery button').forEach(b=>{b.setAttribute('aria-label',T('saveAs')(b.dataset.name));b.firstChild.alt=T('alt');});
  document.getElementById('shotMsg').textContent='';}
document.getElementById('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLang();};
const canvas=document.getElementById('scr');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setPixelRatio(1);renderer.setSize(640,480,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();
const fogDay=0xe4e3ee,fogNight=0x1a2a3e;scene.fog=new THREE.Fog(fogDay,150,520);
const cam=new THREE.PerspectiveCamera(60,4/3,0.1,1000);
const hemi=new THREE.HemisphereLight(0xdfe6fa,0x4a5060,0.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe6dc,0.85);scene.add(sun);scene.add(sun.target);
const SUNDIR=new THREE.Vector3(0.75,0.5,0.45).normalize();sun.target.position.set(0,0,0.3);sun.position.copy(SUNDIR).multiplyScalar(25).add(sun.target.position);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:60});
sun.shadow.bias=-0.002;sun.shadow.normalBias=0.02;
const fill=new THREE.PointLight(0x9fe8d0,0,26,1);fill.position.set(2.5,3,6);scene.add(fill);

const snap={value:0};const textures=[];
let seed=23;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);textures.push(t);return t;}
function mat(o,C){const m=new (C||THREE.MeshLambertMaterial)(o);
  m.onBeforeCompile=s=>{s.uniforms.uSnap=snap;s.vertexShader='uniform float uSnap;\n'+s.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\nif(uSnap>0.0){gl_Position.xy=floor(gl_Position.xy/gl_Position.w*uSnap+0.5)/uSnap*gl_Position.w;}');};return m;}
const col=c=>mat({color:c});
const Y=new THREE.Vector3(0,1,0),V=(x,y,z)=>new THREE.Vector3(x,y,z);
const pick=a=>a[Math.floor(rnd()*a.length)];
// day/night bookkeeping
const toned=[],glows=[],nightOnly=[],dayOnly=[];
function M(c,flat,extra){return mat(Object.assign({color:c,side:THREE.DoubleSide},flat?{flatShading:true,shininess:0,specular:0}:{shininess:18,specular:0x1c1c1c},extra||{}),THREE.MeshPhongMaterial);}
function TM(d,n,flat,extra){const m=M(d,flat,extra);toned.push([m,d,n]);return m;}

// ---------- sky ----------
const skyGeo=new THREE.SphereGeometry(520,24,14);
const skyCol=new Float32Array(skyGeo.attributes.position.count*3);skyGeo.setAttribute('color',new THREE.BufferAttribute(skyCol,3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));sky.renderOrder=-2;scene.add(sky);
const SKY_DAY=[0x4f80d6,0x9db8ea,0xf1dcdc],SKY_NIGHT=[0x050a1c,0x0f2140,0x20405a];
let skyBands=0,lastSky=SKY_DAY;
function paintSky(top,mid,hor){lastSky=[top,mid,hor];const p=skyGeo.attributes.position,a=new THREE.Color(top),b=new THREE.Color(mid),h=new THREE.Color(hor),c=new THREE.Color();
  for(let i=0;i<p.count;i++){let e=p.getY(i)/520;if(skyBands&&e>0.02)e=Math.ceil(e*skyBands)/skyBands;
    if(e<0.02)c.copy(h);else if(e<0.22)c.copy(h).lerp(b,(e-0.02)/0.2);else c.copy(b).lerp(a,Math.min(1,(e-0.22)/0.6));
    skyCol[i*3]=c.r;skyCol[i*3+1]=c.g;skyCol[i*3+2]=c.b;}skyGeo.attributes.color.needsUpdate=true;}
paintSky(...SKY_DAY);
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<260;i++){const th=rnd()*Math.PI*2,el=0.08+rnd()*1.4;a.push(Math.cos(th)*Math.cos(el)*480,Math.sin(el)*480,Math.sin(th)*Math.cos(el)*480);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const m=new THREE.PointsMaterial({color:0xffffff,size:1.5,sizeAttenuation:false,fog:false,transparent:true,opacity:0.85});
  sky.add(new THREE.Points(g,m));nightOnly.push(m);}
// mackerel sky: lots of small flat puffs on a high deck, so they shrink toward the horizon
const cloudMats=[],CLOUD_COLS=[0xffffff,0xf3dde6,0xd7d7f2,0xe9e6f7],SOFT_COLS=[0xffffff,0xf4f6f8,0xe6eaef,0xd8dde4];  // soft clouds stay white/grey
const clouds=new THREE.Group();scene.add(clouds);
{const ms=CLOUD_COLS.map(c=>{const m=new THREE.MeshBasicMaterial({color:c,fog:false});m.userData.c=c;cloudMats.push(m);return m;});const geo=new THREE.IcosahedronGeometry(1,0);
  for(let i=0;i<150;i++){const b=new THREE.Mesh(geo,pick(ms));b.position.set((rnd()-.5)*760,72+rnd()*22,-40-rnd()*430);b.scale.set(6+rnd()*7,0.9,3.5+rnd()*3);b.rotation.y=(rnd()-.5)*0.6;b.userData.c=b.material.color.getHex();clouds.add(b);}}
const puffT=tex(32,32,(g)=>{const gr=g.createRadialGradient(16,16,2,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.55,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);});
function spriteClouds(n){const grp=new THREE.Group();grp.visible=false;scene.add(grp);
  for(let i=0;i<n;i++){const m=new THREE.SpriteMaterial({map:puffT,color:pick(SOFT_COLS),fog:false,transparent:true,depthWrite:false});m.userData.c=m.color.getHex();cloudMats.push(m);
    const sp=new THREE.Sprite(m);sp.position.set((rnd()-.5)*760,72+rnd()*22,-40-rnd()*430);const w=10+rnd()*14;sp.scale.set(w,w*0.45,1);grp.add(sp);}return grp;}
const cloudsN64=spriteClouds(140),cloudsPS2=spriteClouds(320);
// the aurora: additive curtains that ripple slowly
const auroraM=new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});nightOnly.push(auroraM);
const aurora=new THREE.Group();scene.add(aurora);const curtains=[];
[[-320,-380,0,60,1],[-200,-300,1.7,48,0.8],[-60,-420,3.1,70,0.9]].forEach(([x0,z0,ph,h,br])=>{const N=110,pos=new Float32Array((N+1)*2*3),cl=new Float32Array((N+1)*2*3),idx=[];
  for(let i=0;i<=N;i++){const c1=new THREE.Color(0x4dffa0).multiplyScalar(br),c2=new THREE.Color(0x40206a).multiplyScalar(br*0.8);cl.set([c1.r,c1.g,c1.b],i*6);cl.set([c2.r,c2.g,c2.b],i*6+3);
    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(cl,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,auroraM);m.frustumCulled=false;aurora.add(m);curtains.push({g,N,x0,z0,ph,h});});
function waveAurora(t){curtains.forEach(c=>{const p=c.g.attributes.position.array;for(let i=0;i<=c.N;i++){const u=i/c.N,x=c.x0+u*640,z=c.z0+Math.sin(u*7+c.ph+t*0.15)*40+Math.sin(u*17+t*0.4)*8,
    y0=55+Math.sin(u*5+c.ph)*6,hh=c.h*(0.6+0.4*Math.sin(u*11+t*0.3+c.ph));p[i*6]=x;p[i*6+1]=y0;p[i*6+2]=z;p[i*6+3]=x;p[i*6+4]=y0+hh;p[i*6+5]=z-10;}
  c.g.attributes.position.needsUpdate=true;});}
waveAurora(0);

// ---------- the far shore: dark low land, snowy hills on the left, a table mountain on the right ----------
const WY=0.02;
function landH(x){let h=2.2+0.8*Math.sin(x*0.09);

      else{D[i]=Math.min(255,0.393*r+0.769*gg+0.189*b);D[i+1]=Math.min(255,0.349*r+0.686*gg+0.168*b);D[i+2]=Math.min(255,0.272*r+0.534*gg+0.131*b);}}
    g.putImageData(im,0,0);}
  g.textAlign='right';g.textBaseline='alphabetic';g.lineJoin='round';
  const font=(px)=>px+'px "DotGothic16", monospace',x=W2*0.96;
  g.font=font(26);g.lineWidth=6;g.strokeStyle='#0b1020';g.fillStyle='#fff';
  const small='Í s l a n d',cy=H2*0.86;g.strokeText(small,x,cy);g.fillText(small,x,cy);
  const cw=g.measureText(small).width;g.fillStyle='#0b1020';g.fillRect(x-cw-2,cy+6,cw+4,6);g.fillStyle='#fff';g.fillRect(x-cw,cy+7,cw,3);
  g.font=font(58);g.lineWidth=8;g.strokeText('Hafís',x,H2*0.94);g.fillText('Hafís',x,H2*0.94);
  if(screenEl.classList.contains('crt-on')){g.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H2;y+=6)g.fillRect(0,y,W2,2);
    const vg=g.createRadialGradient(W2/2,H2/2,Math.min(W2,H2)*0.45,W2/2,H2/2,Math.max(W2,H2)*0.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=vg;g.fillRect(0,0,W2,H2);}
  flashEl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>flashEl.classList.remove('on')));
  c.toBlob(blob=>{if(!blob){msg.textContent=T('failed');return;}
    const name='hafis-'+stamp()+(night?'-aurora':'')+'.png',url=URL.createObjectURL(blob);
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',T('saveAs')(name));b.dataset.name=name;
    const im=document.createElement('img');im.src=url;im.alt=T('alt');b.appendChild(im);gallery.prepend(b);
    b.onclick=()=>saveShot(name,blob);
    saveShot(name,blob);},'image/png');}
async function saveShot(name,blob){
  if(!dl){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg.textContent=T('saved')(name);}catch(e){msg.textContent=T('noSave');}return;}
  try{await dl.save({filename:name,data:blob});msg.textContent=T('saved')(name);}
  catch(e){const c=e&&e.code;
    if(c==='declined')msg.textContent=T('declined');
    else if(c==='rate_limited')msg.textContent=T('rate');
    else msg.textContent=T('err');}}

let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(auto&&!drag){theta+=dt*0.2*dir;if(theta-autoBase>0.9)dir=-1;if(theta-autoBase<-0.9)dir=1;}
  const [ix,iy]=readInput(),manual=Math.hypot(ix,iy)>0.1;
  if(manual){if(walking){walking=false;walkBtn.setAttribute('aria-pressed','false');}if(auto){auto=false;spinBtn.setAttribute('aria-pressed','false');}
    const dx=-Math.sin(theta)*iy+Math.cos(theta)*ix,dz=-Math.cos(theta)*iy-Math.sin(theta)*ix;wx+=dx*1.5*dt;wz+=dz*1.5*dt;
    let d=Math.atan2(dx,dz)-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*Math.min(1,dt*10);}
  else if(walking){wa+=dt/6.2;wx=PCX+PRX*Math.sin(wa);wz=PCZ+PRZ*Math.cos(wa);yaw=Math.atan2(PRX*Math.cos(wa),-PRZ*Math.sin(wa));}
  wx=Math.max(-40,Math.min(40,wx));wz=Math.max(-15,Math.min(12,wz));
  const moving=manual||walking;amp=moving?Math.min(1,amp+dt*3):Math.max(0,amp-dt*3);if(amp>0)phase+=dt*(manual?7.2:6.4);
  let jy=0;if(jumpT>=0){jumpT+=dt;const k=jumpT/0.6;jy=4*0.38*k*(1-k);if(k>=1){jumpT=-1;jy=0;footstep(wx,wz,true);}}
  {const si=Math.floor(phase/Math.PI);if(si!==lastStep){lastStep=si;if(amp>0.5&&jumpT<0){const sd=si%2?1:-1;footstep(wx+Math.cos(yaw)*sd*0.1+Math.sin(yaw)*0.12,wz-Math.sin(yaw)*sd*0.1+Math.cos(yaw)*0.12,false);}}}
  cracks.forEach(c=>{const u=c.userData;if(u.t<0)return;u.t+=dt;const k=u.t/u.life;if(k>=1){u.t=-1;c.visible=false;return;}c.material.opacity=u.t<0.12?1:0.85*(1-k*k);});
  if(shT>=0){shT+=dt;const p=shG.attributes.position;for(let i=0;i<SH;i++){const v=shV[i];if(!v[0]&&!v[1]&&!v[2])continue;v[1]-=9.8*dt;let y=p.getY(i)+v[1]*dt;if(y<ICEY+0.01){y=ICEY+0.01;v[0]=v[1]=v[2]=0;}p.setXYZ(i,p.getX(i)+v[0]*dt,y,p.getZ(i)+v[2]*dt);}p.needsUpdate=true;shM.opacity=Math.max(0,0.95-shT*1.2);if(shT>0.8)shT=-1;}
  fx.x+=(wx-fx.x)*Math.min(1,dt*3);fx.z+=(wz-fx.z)*Math.min(1,dt*3);
  sun.target.position.set(fx.x,0,fx.z);sun.position.copy(SUNDIR).multiplyScalar(25).add(sun.target.position);
  cam.position.set(fx.x+Math.sin(theta)*R,camY,fx.z+Math.cos(theta)*R);cam.lookAt(fx.x,1.2,fx.z-1.5);
  sky.position.copy(cam.position);
  shimT.offset.x=t*0.004;shimT.offset.y=t*0.002;fill.position.set(fx.x+2.5,3,fx.z+6);
  if(night)waveAurora(t);
  gulls.forEach(g=>{const u=g.userData,a=t*u.s+u.o;g.position.set(Math.cos(a)*u.r,u.h+Math.sin(t*0.7+u.o)*0.8,-30+Math.sin(a)*u.r);g.rotation.y=-a;const f=Math.sin(t*6+u.o)*0.5;u.w[0].rotation.z=f;u.w[1].rotation.z=-f;});
  [MB,MN,MR].forEach(S=>{if(!S.P.visible)return;S.head.rotation.y=Math.sin(t*0.6)*0.06;S.head.rotation.x=Math.sin(t*0.9)*0.02;
    S.P.scale.y=1+Math.sin(t*1.6)*0.005;const sw=Math.sin(phase)*amp;
    S.P.position.set(wx,Math.abs(Math.cos(phase))*0.03*amp+jy,wz);S.P.rotation.y=yaw;
    S.legs.forEach((l,i)=>{l.rotation.x=(i?-1:1)*sw*0.5-(jumpT>=0?0.35*Math.sin(Math.PI*jumpT/0.6)*(i?1:0.6):0);});
    S.arms.forEach((a,i)=>{const hk=a.userData.hold?0.2:1;a.rotation.z=(i?1:-1)*(0.02+Math.sin(t*0.8+i)*0.025*(1-amp)+0.05*amp)*hk;a.rotation.x=(Math.sin(t*0.7+i*2)*0.03*(1-amp)+(i?1:-1)*sw*0.45)*hk;});});
  holdK+=((held||throwT>=0?1:0)-holdK)*Math.min(1,dt*8);
  {const S=[MB,MN,MR].find(S=>S.P.visible),arm=S.arms[0];
    if(throwT>=0){throwT+=dt;const k=Math.min(1,throwT/0.32);arm.rotation.x=k<0.4?-0.9+1.9*(k/0.4):1.0-3.0*((k-0.4)/0.6);arm.rotation.z=-0.35-0.5*Math.sin(Math.PI*k);
      if(held&&throwT>0.16)releasePlate();if(k>=1)throwT=-1;}
    else if(holdK>0.01){arm.rotation.x=arm.rotation.x*(1-holdK)+(-0.9)*holdK;arm.rotation.z=arm.rotation.z*(1-holdK)+(-0.35)*holdK;}
    if(held){S.P.updateMatrixWorld(true);held.position.copy(HAND).applyMatrix4(arm.matrixWorld);arm.getWorldQuaternion(tmpQ);held.quaternion.copy(tmpQ).multiply(qx);}}
  for(let i=flying.length-1;i>=0;i--){const o=flying[i],v=o.userData.v,sp=o.userData.spin;v[1]-=9.8*dt;o.position.x+=v[0]*dt;o.position.y+=v[1]*dt;o.position.z+=v[2]*dt;
    o.rotation.x+=sp[0]*dt;o.rotation.y+=sp[1]*dt;o.rotation.z+=sp[2]*dt;const gy=o.position.z<-15.4?WY:iceAt(o.position.x,o.position.z)?ICEY:0;
    if(o.position.y<=gy+0.03){flying.splice(i,1);landPlate(o);}}
  frags.forEach(f=>{const v=f.userData.v;if(!v)return;v[1]-=9.8*dt;f.position.x+=v[0]*dt;f.position.y+=v[1]*dt;f.position.z+=v[2]*dt;f.rotation.y+=v[0]*dt*3;
    const gy=(f.position.z<-15.4?WY-0.2:iceAt(f.position.x,f.position.z)?ICEY:0)+0.013;if(f.position.y<=gy){f.position.y=gy;f.rotation.x=f.rotation.z=0;f.userData.v=null;if(f.position.z<-15.4)f.visible=false;}});
  ringsW.forEach(r=>{const u=r.userData;if(u.t<0)return;u.t+=dt;const k=(u.t-u.d)/1.1;if(k<0){r.material.opacity=0;return;}if(k>=1){u.t=-1;r.material.opacity=0;return;}r.scale.setScalar(1+k*5);r.material.opacity=(1-k)*0.8;});
  renderer.render(scene,cam);if(wantShot){wantShot=false;takeShot();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
