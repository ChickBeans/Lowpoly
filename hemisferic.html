<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Hemisfèric — ローポリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#e2e7e4;--panel:#f6f4ee;--ink:#22262e;--dim:#5a6170;--accent:#2f7f8f;--edge:#22262e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161c1e;--panel:#25302f;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc3d0;--edge:#000;}}
:root[data-theme="dark"]{--bg:#161c1e;--panel:#25302f;--ink:#eceef2;--dim:#a2a9b8;--accent:#6cc3d0;--edge:#000;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.6rem;font-weight:400;margin:4px 0 2px}
p{margin:0;color:var(--dim);font-size:.95rem;line-height:1.6}
.tv{margin:16px 0 12px;background:var(--edge);padding:10px;border-radius:14px;box-shadow:0 0 0 3px var(--panel) inset}
canvas{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:6px;touch-action:none;cursor:grab}
canvas.smooth{image-rendering:auto}
.screen{position:relative}
.crt{position:absolute;inset:0;pointer-events:none;display:none;border-radius:6px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
.screen.crt-on .crt{display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:6px;transition:opacity .35s ease-out}
.flash.on{opacity:.9;transition:none}
button.shot{border-color:var(--accent);color:var(--accent);font-weight:700}
.msg{min-height:1.4em;margin-top:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.gallery button{padding:0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--edge);line-height:0}
.gallery img{width:100%;height:auto;display:block}
.loc{position:absolute;right:4%;bottom:5%;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;color:#fff;font-family:"DotGothic16",ui-monospace,monospace;text-shadow:2px 2px 0 #0b1020,-1px -1px 0 #0b1020,1px -1px 0 #0b1020,-1px 1px 0 #0b1020;line-height:1.15}
.loc .c{font-size:clamp(11px,2.6vw,18px);letter-spacing:.2em;border-bottom:2px solid rgba(255,255,255,.85);padding-bottom:2px;margin-bottom:3px}
.loc .t{font-size:clamp(18px,5vw,34px);letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pad-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 6px;padding:12px 22px;background:var(--panel);border:2px solid var(--ink);border-radius:48px}
.dpad{position:relative;width:126px;height:126px;flex:none;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad .arm{position:absolute;background:var(--ink);border-radius:6px}
.dpad .h{left:0;top:42px;width:126px;height:42px}.dpad .v{left:42px;top:0;width:42px;height:126px}
.dpad .ar{position:absolute;color:var(--panel);font-size:14px;line-height:1;pointer-events:none}
.dpad .u{left:56px;top:10px}.dpad .d{left:56px;bottom:10px}.dpad .l{left:10px;top:56px}.dpad .r{right:10px;top:56px}
.dpad .dot{position:absolute;left:55px;top:55px;width:16px;height:16px;border-radius:50%;background:var(--panel);opacity:.25;pointer-events:none;transition:transform .06s}
.dpad.on .arm{background:var(--accent)}
.pad-a{display:flex;flex-direction:column;align-items:center;gap:6px}
button.abtn{width:78px;height:78px;padding:0;border-radius:50%;background:#c63a4f;color:#fff;border:3px solid var(--ink);font-size:1.7rem;touch-action:manipulation}
button.abtn:active{transform:translateY(2px)}
.pad-a small{font-size:.8rem;color:var(--dim)}
.hint{font-size:.85rem;margin-bottom:12px}
button{font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{margin:0 0 6px;font-size:.9rem}.back a{color:var(--accent)}
</style>
</head>
<body>
<main><p class="back"><a href="index.html">← ローポリ</a></p>
  <h1 data-i="title">ヘミスフェリックの瞳の中</h1>
  <p data-i="lead">写真をもとにしたオリジナルのローポリキャラ。ドラッグで左右・上下に視点を動かし、2本指（またはホイール）でズームできます。矢印キーと＋／−キーでも操作できます。</p>
  <div class="tv"><div class="screen"><canvas id="scr" width="640" height="480" data-ia="scene" aria-label="バレンシアのヘミスフェリックの中、白いドームの前に立つローポリの男性"></canvas><div class="loc" lang="ca"><span class="c">València</span><span class="t">L'Hemisfèric</span></div><div class="crt" aria-hidden="true"></div><div class="flash" aria-hidden="true"></div></div></div>
  <div class="pad-row">
    <div class="dpad" id="dpad" role="group" data-ia="dpad" aria-label="十字キー（押した方向に歩く）"><span class="arm h"></span><span class="arm v"></span><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><span class="dot" id="dot"></span></div>
    <div class="pad-a"><button id="jump" class="abtn" data-ia="jump" aria-label="ジャンプ">A</button><small data-i="jumpL">ジャンプ</small></div>
  </div>
  <p class="hint" data-i="hint">十字キーで歩く・Aでジャンプ（キーボードはWASDとスペース）</p>
  <div class="row" role="group" data-ia="modes" aria-label="表示モード">
    <button id="m1" aria-pressed="true" data-i="ps1">初代プレステ風</button>
    <button id="m64" aria-pressed="false" data-i="n64">64風</button>
    <button id="m2" aria-pressed="false" data-i="ps2">PS2風</button>
    <button id="spin" aria-pressed="true" data-i="spin">自動で回す</button>
    <button id="walk" aria-pressed="false" data-i="walk">🚶 歩く</button>
    <button id="dusk" aria-pressed="false" data-i="dusk">夕焼け</button>
    <button id="crt" aria-pressed="false" data-i="crt">ブラウン管</button>
    <button id="mono" aria-pressed="false" data-i="mono">白黒</button>
    <button id="sepia" aria-pressed="false" data-i="sepia">セピア</button>
    <button id="photo" data-i="photo">記念写真アングル</button>
    <button id="back" data-i="back">入口へワープ</button>
    <button id="shot" class="shot" data-i="shot">📸 写真を撮る</button>
    <button id="lang" lang="en">English</button>
  </div>
  <p id="shotMsg" class="msg" aria-live="polite"></p>
  <div id="gallery" class="gallery" data-ia="gallery" aria-label="撮った写真"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
// ---------- language ----------
const L={ja:{title:'ヘミスフェリックの瞳の中',lead:'写真をもとにしたオリジナルのローポリキャラ。ドラッグで左右・上下に視点を動かし、2本指（またはホイール）でズームできます。矢印キーと＋／−キーでも操作できます。',
  scene:'バレンシアのヘミスフェリックの中、白いドームの前に立つローポリの男性',modes:'表示モード',ps1:'初代プレステ風',mono:'白黒',sepia:'セピア',ps2:'PS2風',n64:'64風',spin:'自動で回す',walk:'🚶 歩く',dpad:'十字キー（押した方向に歩く）',jump:'ジャンプ',jumpL:'ジャンプ',hint:'十字キーで歩く・Aでジャンプ（キーボードはWASDとスペース）',dusk:'夕焼け',crt:'ブラウン管',photo:'記念写真アングル',back:'入口へワープ',shot:'📸 写真を撮る',gallery:'撮った写真',
  other:'English',otherLang:'en',failed:'撮影に失敗しました。もう一度試してください。',saveAs:n=>n+' を保存',alt:'撮影した写真',
  noSave:'撮影しました（この表示では保存できないので、下の写真を長押しして保存してください）',saved:n=>'保存しました：'+n,
  declined:'保存をキャンセルしました。下の写真を押せばもう一度保存できます。',rate:'少し待ってから、下の写真を押して保存してください。',err:'この表示では保存できませんでした。下の写真を長押しして保存してください。'},
 en:{title:'Inside the Eye of L\'Hemisfèric',lead:'An original low-poly character inspired by a photo. Drag to move the view around, and pinch with two fingers (or use the scroll wheel) to zoom. Arrow keys and +/− work too.',
  scene:'A low-poly man standing in front of the white dome inside L\'Hemisfèric, Valencia',modes:'Display mode',ps1:'PS1 style',mono:'Black & white',sepia:'Sepia',ps2:'PS2 style',n64:'N64 style',spin:'Auto-rotate',walk:'🚶 Walk',dpad:'D-pad (walk in that direction)',jump:'Jump',jumpL:'Jump',hint:'D-pad to walk, A to jump (WASD and Space on a keyboard)',dusk:'Sunset',crt:'CRT TV',photo:'Photo angle',back:'Go to the entrance',shot:'📸 Take a photo',gallery:'Your photos',
  other:'日本語',otherLang:'ja',failed:'The photo didn\'t work. Please try again.',saveAs:n=>'Save '+n,alt:'Photo you took',
  noSave:'Photo taken (it can\'t be saved from this view, so press and hold the photo below to save it).',saved:n=>'Saved: '+n,
  declined:'Save cancelled. Tap the photo below to save it again.',rate:'Please wait a moment, then tap the photo below to save it.',err:'Couldn\'t save from this view. Press and hold the photo below to save it.'}};
let lang='ja';const T=k=>L[lang][k];
function applyLang(){document.documentElement.lang=lang;document.title=lang==='ja'?'L\'Hemisfèric — ローポリ':'L\'Hemisfèric — Low-poly';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.ia)));
  const lb=document.getElementById('lang');lb.textContent=T('other');lb.lang=T('otherLang');
  document.querySelectorAll('#gallery button').forEach(b=>{b.setAttribute('aria-label',T('saveAs')(b.dataset.name));b.firstChild.alt=T('alt');});
  document.getElementById('shotMsg').textContent='';}
document.getElementById('lang').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLang();};
const canvas=document.getElementById('scr');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:false});
renderer.setPixelRatio(1);renderer.setSize(640,480,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
const scene=new THREE.Scene();
const fogC=new THREE.Color(0xdfe9ea);scene.fog=new THREE.Fog(fogC.clone(),70,260);
const cam=new THREE.PerspectiveCamera(60,4/3,0.1,900);
const hemi=new THREE.HemisphereLight(0xe8eee8,0xc8cdc0,0.78);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff6e6,0.95);scene.add(sun);scene.add(sun.target);
const SUN_DAY=new THREE.Vector3(1,1.02,0.32).normalize(),SUN_DUSK=new THREE.Vector3(1,0.5,-0.25).normalize();
function aimSun(d){sun.target.position.set(0,0,-25);sun.position.copy(d).multiplyScalar(90).add(sun.target.position);}
aimSun(SUN_DAY);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-58,right:58,top:58,bottom:-58,near:1,far:220});
sun.shadow.bias=-0.0008;sun.shadow.normalBias=0.04;

const snap={value:0};const textures=[];
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);textures.push(t);return t;}
function mat(o,C){const m=new (C||THREE.MeshLambertMaterial)(o);
  m.onBeforeCompile=s=>{s.uniforms.uSnap=snap;s.vertexShader='uniform float uSnap;\n'+s.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\nif(uSnap>0.0){gl_Position.xy=floor(gl_Position.xy/gl_Position.w*uSnap+0.5)/uSnap*gl_Position.w;}');};return m;}
const col=c=>mat({color:c});
const Y=new THREE.Vector3(0,1,0);
const pick=a=>a[Math.floor(rnd()*a.length)];

// ---------- sky dome (seen through the glass) ----------
const skyGeo=new THREE.SphereGeometry(520,24,14);
const skyCol=new Float32Array(skyGeo.attributes.position.count*3);skyGeo.setAttribute('color',new THREE.BufferAttribute(skyCol,3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));scene.add(sky);
let skyBands=0,lastSky=[0x4b8fd8,0x8fc0ea,0xe6f1f4];
function paintSky(top,mid,hor){lastSky=[top,mid,hor];const p=skyGeo.attributes.position,a=new THREE.Color(top),b=new THREE.Color(mid),h=new THREE.Color(hor),c=new THREE.Color();
  for(let i=0;i<p.count;i++){let e=p.getY(i)/520;if(skyBands&&e>0.02)e=Math.ceil(e*skyBands)/skyBands;
    if(e<0.02)c.copy(h);else if(e<0.25)c.copy(h).lerp(b,(e-0.02)/0.23);else c.copy(b).lerp(a,Math.min(1,(e-0.25)/0.6));
    skyCol[i*3]=c.r;skyCol[i*3+1]=c.g;skyCol[i*3+2]=c.b;}skyGeo.attributes.color.needsUpdate=true;}
paintSky(...lastSky);
const cloudM=new THREE.MeshBasicMaterial({color:0xffffff,fog:false});const cloudMats=[cloudM];
const clouds=new THREE.Group();scene.add(clouds);
[[-300,80,-220,1.2],[-260,70,40,0.9],[300,75,-160,1],[280,60,80,0.8]].forEach(([x,y,z,s])=>{
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);g.rotation.y=Math.atan2(x,z);
  for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(9+rnd()*7,0),cloudM);b.position.set((i-2.5)*11+rnd()*5,rnd()*4,rnd()*6);b.scale.set(1.3,0.42,0.8);g.add(b);}
  clouds.add(g);});
const puffT=tex(32,32,(g)=>{const gr=g.createRadialGradient(16,16,2,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.55,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);});
function spriteClouds(list,n){const grp=new THREE.Group();grp.visible=false;scene.add(grp);
  list.forEach(([x,y,z,s])=>{for(let i=0;i<n;i++){const m=new THREE.SpriteMaterial({map:puffT,color:0xffffff,fog:false,transparent:true,depthWrite:false});cloudMats.push(m);
    const sp=new THREE.Sprite(m);sp.position.set(x+rnd()*20,y+rnd()*5*s,z+(i-n/2)*9*s+rnd()*8);const w=(26+rnd()*20)*s;sp.scale.set(w,w*0.55,1);grp.add(sp);}});return grp;}
const cloudsN64=spriteClouds([[-300,80,-220,1.2],[-260,70,40,0.9],[300,75,-160,1],[280,60,80,0.8]],4);
const cloudsPS2=spriteClouds([[-320,82,-260,1.2],[-280,62,-60,0.8],[-260,74,80,1],[300,76,-200,1.1],[290,58,-20,0.8],[270,68,110,0.9]],8);

// ---------- floor: big grey stone slabs ----------
function floorTex(N,detail){return tex(N,N,(g,w)=>{const s=w/64;g.fillStyle='#4f4d4b';g.fillRect(0,0,w,w);
  const rows=[0,14,30,44,64];for(let r=0;r<4;r++){let x=(r%2)*9;const y0=rows[r],y1=rows[r+1];
    while(x<64+9){const tw=[16,20,24][Math.floor(rnd()*3)],v=104+Math.floor(rnd()*22);
      g.fillStyle='rgb('+v+','+(v-2)+','+(v-5)+')';g.fillRect(((x+1)%64)*s,(y0+1)*s,(tw-1)*s,(y1-y0-1)*s);
      if(x+tw>64){g.fillRect(0,(y0+1)*s,(x+tw-64-1)*s,(y1-y0-1)*s);}
      if(detail){for(let i=0;i<tw*(y1-y0)*detail;i++){const k=v+Math.floor((rnd()-.5)*24);g.fillStyle='rgb('+k+','+(k-2)+','+(k-4)+')';
        g.fillRect((((x+1+rnd()*(tw-2))%64))*s,(y0+1+rnd()*(y1-y0-2))*s,s,s);}}
      x+=tw;}}},150,150);}
function floorMesh(N,detail){const m=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat({map:floorTex(N,detail)}));m.rotation.x=-Math.PI/2;m.position.y=0;m.receiveShadow=true;m.visible=false;scene.add(m);return m;}
const floors={ps1:floorMesh(64,0),n64:floorMesh(128,0.4),ps2:floorMesh(256,2.2)};
// (each texture repeats every 2.67 m -> slabs about 0.7–1 m)

// ---------- the eye: white dome on its ring, with a railing ----------
const DZ=-30,DR=14,BASE=0.45;
const stuccoT=tex(128,64,(g)=>{g.fillStyle='#ecece6';g.fillRect(0,0,128,64);for(let i=0;i<2600;i++){const k=214+Math.floor(rnd()*36);g.fillStyle='rgb('+k+','+k+','+(k-4)+')';g.fillRect(Math.floor(rnd()*128),Math.floor(rnd()*64),1,1);}},10,5);
function domeMesh(ws,hs,m){const d=new THREE.Mesh(new THREE.SphereGeometry(DR,ws,hs,0,Math.PI*2,0,Math.PI/2),m);d.position.set(0,BASE,DZ);d.castShadow=d.receiveShadow=true;d.visible=false;scene.add(d);return d;}
const domes={ps1:domeMesh(18,8,mat({color:0xf0f0ea,flatShading:true,shininess:0,specular:0},THREE.MeshPhongMaterial)),
  n64:domeMesh(36,16,mat({color:0xf0f0ea})),
  ps2:domeMesh(72,32,mat({map:stuccoT,shininess:6,specular:0x161616},THREE.MeshPhongMaterial))};
const GAP=0.27;
const plat=new THREE.Mesh(new THREE.CylinderGeometry(16.6,16.6,BASE,64),col(0xc9c6bf));plat.position.set(0,BASE/2,DZ);plat.receiveShadow=true;scene.add(plat);
const lip=new THREE.Mesh(new THREE.CylinderGeometry(16.75,16.75,0.08,64),col(0xe8e6e0));lip.position.set(0,BASE-0.04,DZ);lip.receiveShadow=true;scene.add(lip);
const railM=col(0x4e5154);
function mergeBeams(list){const pos=[],nor=[],q=new THREE.Quaternion(),m4=new THREE.Matrix4(),s=new THREE.Vector3(1,1,1),dir=new THREE.Vector3(),mid=new THREE.Vector3();
  list.forEach(([A,B,w,d])=>{dir.copy(B).sub(A);const len=dir.length();const g=new THREE.BoxGeometry(w,len,d).toNonIndexed();
    q.setFromUnitVectors(Y,dir.normalize());mid.copy(A).add(B).multiplyScalar(0.5);m4.compose(mid,q,s);g.applyMatrix4(m4);
    const p=g.attributes.position.array,n=g.attributes.normal.array;for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i]);}g.dispose();});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));return g;}
{const RR=16.35,posts=[];for(let i=0;i<72;i++){const a=i/72*Math.PI*2,x=Math.cos(a)*RR,z=DZ+Math.sin(a)*RR;if(Math.abs(a-Math.PI*1.5)<GAP+0.02)continue;posts.push([new THREE.Vector3(x,BASE,z),new THREE.Vector3(x,BASE+1.0,z),0.045,0.045]);}
  const pm=new THREE.Mesh(mergeBeams(posts),railM);pm.castShadow=true;scene.add(pm);
  [0.35,0.55,0.75,1.0].forEach(h=>{const tg=new THREE.TorusGeometry(RR,h===1?0.035:0.016,4,120,Math.PI*2-2*GAP);tg.rotateZ(Math.PI*1.5+GAP);const r=new THREE.Mesh(tg,railM);r.rotation.x=Math.PI/2;r.position.set(0,BASE+h,DZ);r.castShadow=true;scene.add(r);});}


// ---------- the back of the dome: entrance, stairwell, planters, queue posts ----------
const mosaic2=tex(128,128,(g)=>{g.fillStyle='#bdb8ae';g.fillRect(0,0,128,128);
  for(let i=0;i<900;i++){const cx=rnd()*128,cy=rnd()*128,r=2+rnd()*3,n=4+Math.floor(rnd()*2),k=228+Math.floor(rnd()*26);g.fillStyle='rgb('+k+','+(k-1)+','+(k-4)+')';

  let jy=0;if(jumpT>=0){jumpT+=dt;const k=jumpT/0.6;jy=4*0.38*k*(1-k);if(k>=1){jumpT=-1;jy=0;}}
  fx.x+=(wx-fx.x)*Math.min(1,dt*3);fx.z+=(wz-fx.z)*Math.min(1,dt*3);
  cam.position.set(fx.x+Math.sin(theta)*R,camY,fx.z+Math.cos(theta)*R);cam.lookAt(fx.x,1.2,fx.z-1.5);
  sky.position.copy(cam.position);
  [MB,MN,MR].forEach(S=>{if(!S.P.visible)return;S.head.rotation.y=Math.sin(t*0.6)*0.06;S.head.rotation.x=Math.sin(t*0.9)*0.02;
    S.P.scale.y=1+Math.sin(t*1.6)*0.005;const sw=Math.sin(phase)*amp;
    S.P.position.set(wx,gy+Math.abs(Math.cos(phase))*0.03*amp+jy,wz);S.P.rotation.y=yaw;
    S.legs.forEach((l,i)=>{l.rotation.x=(i?-1:1)*sw*0.5-(jumpT>=0?0.35*Math.sin(Math.PI*jumpT/0.6)*(i?1:0.6):0);});
    S.arms.forEach((a,i)=>{a.rotation.z=(i?1:-1)*(0.02+Math.sin(t*0.8+i)*0.025*(1-amp)+0.05*amp);a.rotation.x=Math.sin(t*0.7+i*2)*0.03*(1-amp)+(i?1:-1)*sw*0.45;});});
  if(motes.visible){for(let i=0;i<mpos.count;i++){let y=mpos.getY(i)+dt*0.05*(0.5+(i%5)*0.2);if(y>6.3)y=0.3;mpos.setY(i,y);mpos.setX(i,mpos.getX(i)+Math.sin(t*0.5+i)*dt*0.03);}mpos.needsUpdate=true;}
  renderer.render(scene,cam);if(wantShot){wantShot=false;takeShot();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
